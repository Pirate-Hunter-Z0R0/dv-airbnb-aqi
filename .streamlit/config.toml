# Design system for the dashboard. Light and dark are both defined, so viewers can switch in
# the app menu (Settings → Theme) and the default follows their OS.

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#1F5F74"
backgroundColor = "#FAFAFA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
borderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F8FAFC"
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&display=swap"
codeFont = "'Geist Mono':https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..600&display=swap"
baseFontSize = 15
baseRadius = "0.65rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true
metricValueFontSize = "1.9rem"
metricValueFontWeight = 600
# Muted editorial palette for non-AQI series (room types, cities). AQI always uses its own scale.
chartCategoricalColors = ["#1F5F74", "#C0603A", "#7C8C3A", "#7A4E7E", "#C9A15A", "#5C6B7A", "#3F8F86", "#B65C74", "#2F3A4A", "#4F7A52"]
